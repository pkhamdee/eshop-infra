# Namespaces labelled eshop.io/gateway-access may attach HTTPRoutes to the eshop Gateway.
# Namespaces labelled policy.sigstore.dev/include enforce the image policy (policy-controller.yaml; image-policy.yaml in
# ../configs): their docker.io/pkhamdee/* images must be signed by eShop's pipeline, or the pod is refused. The label
# is the enforcement boundary (ADR 0011); namespaces join one at a time, each once everything it runs is signed:
# thirdparty, then eshop-dev (#136), eshop-qa (#134), eshop-prod (#137).
apiVersion: v1
kind: Namespace
metadata:
  name: eshop-dev
  labels:
    eshop.io/gateway-access: "true"
    policy.sigstore.dev/include: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: eshop-qa
  labels:
    eshop.io/gateway-access: "true"
    policy.sigstore.dev/include: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: eshop-prod
  labels:
    eshop.io/gateway-access: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: thirdparty
  labels:
    eshop.io/gateway-access: "true"
    policy.sigstore.dev/include: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
# policy-controller (policy-controller.yaml). Never labelled policy.sigstore.dev/include: the webhook must not check
# its own pods, or it couldn't come back after an outage.
apiVersion: v1
kind: Namespace
metadata:
  name: cosign-system
---
# Actions Runner Controller (actions-runner-controller.yaml) and the runner pods it starts (deploy/infrastructure/runners).
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
