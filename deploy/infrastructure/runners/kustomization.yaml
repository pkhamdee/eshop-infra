# The cluster's GitHub Actions runner for the smoke test (Flux Kustomization infra-runners, ADR 0008).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - eshop-e2e.yaml
  - runner-rbac.yaml
  - image-automation.yaml
  # The scale set's GitHub token (docs/setup.md, "Cluster runner"). Renew it with sops; the token is never in plain text.
  - eshop-e2e-github.sops.yaml
