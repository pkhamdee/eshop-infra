# Accepted ZAP alerts for the DAST gate (scripts/gates/dast.sh), applied by dast-verdict.py to ZAP's JSON reports.
#
# The gate fails on any High-risk alert unless it is accepted here. One rule per line, TAB-separated, in ZAP's `-c`
# format (ZAP itself is not given this file, so every rule still runs and every alert stays in ZAP's reports):
#
#   <rule id>	IGNORE	(<rule name>)          accept every alert of that rule
#   <rule id>	OUTOFSCOPE	<url regex>        accept that rule's alerts on URLs matching the regex (from the start;
#                                              `*` as the id means every rule)
#
# Every rule line needs a `# reason: ...` comment in the comment block directly above it, saying why the alert is a
# false positive or an accepted risk, so the decision can be reviewed. Prefer fixing the finding. Rule ids and names
# are in the reports (reports/dast/summary.txt) and at https://www.zaproxy.org/docs/alerts/.

# PII Disclosure flags any 16-digit number passing the Luhn check as a card number. eshop-api answers every error
# (401s included) with a problem+json body whose traceId is random hex, 00-<32 hex>-<16 hex>-00, which now and then
# holds 16 decimal digits that pass the check: eshop-api run 42019572548 failed on 4757294275344493 in a signed-out
# 401 from POST /api/back-office/lot-photos. eShop stores and returns no card numbers (payments are the Enterprise
# System's; Thai ID numbers are 13 digits), so the rule can only ever match such random IDs.
# reason: false positive on random trace IDs; eShop has no card data to disclose (#105)
10062	IGNORE	(PII Disclosure)
