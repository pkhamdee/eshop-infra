# eshop-prod = one release, pinned here: its manifests (deploy/apps/prod at tag vX.Y.Z) and its X.Y.Z images.
#
# The pin is the lines ending in `# release-pin: prod`; they always hold the same exact version, and each image's
# digest (it runs as <image>:X.Y.Z@sha256:..., so a repointed tag changes nothing). Prod moves only
# when a promotion PR changes them and is merged (merging is the production approval); a rollback is a promotion
# PR back to an earlier release. Nothing follows tags automatically: pushing a newer tag does not change prod.
#
#   scripts/pin-release.sh prod           # the pinned release
#   scripts/pin-release.sh prod X.Y.Z     # the promotion PR's only edit (docs/git-workflow.md, "Promotion and rollback")
#
# Object names here are what Flux tracks: renaming eshop-release or apps-prod makes Flux delete and recreate it,
# and deleting apps-prod prunes everything it applied in eshop-prod, the PostgreSQL Cluster (prod's data) included.
# apps-prod comes first: `flux build|diff kustomization apps-prod --kustomization-file` reads documents in order
# as Kustomizations until the name matches.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-prod
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/apps/prod
  prune: true
  wait: true
  # deploy/apps/prod as it is in the pinned release tag.
  sourceRef:
    kind: GitRepository
    name: eshop-release
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # The pinned release's images, by digest (deploy/apps/prod has no tags). Every prod service needs an entry here.
  images:
    - name: docker.io/pkhamdee/eshop-api
      newTag: "0.7.0" # release-pin: prod
      digest: "sha256:447fb7736b852a69cde1e1a31dcc00758fe4116013a2f1db29f3f5956725f1f4" # release-pin: prod
    - name: docker.io/pkhamdee/eshop-web
      newTag: "0.7.0" # release-pin: prod
      digest: "sha256:78b4c5d89659985aa8c9c8eefc17d3ae9c2ff86d7cf326ff947f1810d445ca0d" # release-pin: prod
    - name: docker.io/pkhamdee/eshop-node-api
      newTag: "0.7.0" # release-pin: prod
      digest: "sha256:f767947a56876e315e3b165e6a78c83de408c84f48ff4b19b217d4b1c6c3ef9d" # release-pin: prod
    - name: docker.io/pkhamdee/eshop-sync-master
      newTag: "0.7.0" # release-pin: prod
      digest: "sha256:aaa6d312411b1cac742b9cdd10509038869eaf3b86ebca3a7bef2cd8dff6253e" # release-pin: prod
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: eshop-release
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/pkhamdee/eshop-infra
  secretRef:
    name: flux-system
  ref:
    # An exact version selects exactly tag vX.Y.Z.
    semver: "0.7.0" # release-pin: prod
  ignore: |
    /*
    !/deploy/
